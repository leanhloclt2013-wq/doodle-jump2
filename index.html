<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump - Man Face Edition</title>
    <style>
        body {
            background-color: #202020;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #f7f7f7;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        p {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>DOODLE JUMP: MAN FACE</h1>
    <canvas id="gameCanvas" width="400" height="550"></canvas>
    <p>Dùng phím mũi tên <b>Trái / Phải</b> hoặc phím <b>A / D</b> để di chuyển.<br>
    <span style="color: #ff5252;">⚠️ Cảnh báo (>200 điểm): Tránh thanh màu Đỏ (Bẫy) và cẩn thận thanh màu Nâu (Gãy)!</span></p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let isGameOver = false;

        // Nhân vật (Doodler)
        let player = {
            x: 180,
            y: 420,
            width: 44,
            height: 44,
            vx: 0,
            vy: 0
        };

        // Danh sách các thanh nhảy (Platforms)
        let platforms = [];
        const platformWidth = 85;
        const platformHeight = 15;
        let platformCount = 7;

        // Phím bấm
        let keys = {};
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        // Tạo loại thanh nhảy dựa trên điểm số (Đã đổi mốc thành 200 điểm)
        function getRandomPlatformType() {
            if (score < 200) return 'normal';
            
            let rand = Math.random();
            if (score >= 200 && score < 600) {
                // Xuất hiện thanh gãy (30%), còn lại thanh thường
                if (rand < 0.3) return 'break';
            } else if (score >= 600) {
                // Cả thanh gãy (25%) và thanh bẫy (20%)
                if (rand < 0.25) return 'break';
                else if (rand < 0.45) return 'trap';
            }
            return 'normal';
        }

        // Khởi tạo các thanh nhảy ban đầu
        function initPlatforms() {
            platforms = [];
            platforms.push({
                x: 160,
                y: 470,
                type: 'normal',
                broken: false
            });

            for (let i = 1; i < platformCount; i++) {
                let pY = 470 - (i * 70);
                platforms.push({
                    x: Math.random() * (canvas.width - platformWidth),
                    y: pY,
                    type: 'normal',
                    broken: false
                });
            }
        }

        // Bắt đầu lại game
        function resetGame() {
            score = 0;
            isGameOver = false;
            player.x = 180;
            player.y = 420;
            player.vx = 0;
            player.vy = 0;
            initPlatforms();
        }

        // Cập nhật logic game
        function update() {
            if (isGameOver) return;

            // Tăng nhẹ tốc độ di chuyển ngang
            if (keys["ArrowLeft"] || keys["KeyA"]) {
                player.vx = -4.0;
            } else if (keys["ArrowRight"] || keys["KeyD"]) {
                player.vx = 4.0;
            } else {
                player.vx *= 0.8; 
            }

            player.x += player.vx;

            if (player.x > canvas.width) player.x = -player.width;
            if (player.x < -player.width) player.x = canvas.width;

            player.vy += 0.22; // Tăng nhẹ trọng lực rơi để game nhanh hơn một chút
            player.y += player.vy;

            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                platforms.forEach(p => {
                    p.y += diff;
                });
                score += Math.floor(diff * 0.3); 
            }

            // Va chạm với các thanh nhảy (chỉ khi đang rơi)
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (
                        !p.broken &&
                        player.x + player.width > p.x &&
                        player.x < p.x + platformWidth &&
                        player.y + player.height >= p.y &&
                        player.y + player.height <= p.y + platformHeight + player.vy
                    ) {
                        if (p.type === 'trap') {
                            isGameOver = true;
                        } else if (p.type === 'break') {
                            p.broken = true;
                        } else {
                            // Tăng nhẹ lực nảy lên (-8.0 thay vì -7.5) giúp game nhanh và cuốn hơn
                            player.vy = -8.0; 
                        }
                    }
                });
            }

            // Tái tạo thanh nhảy mới phía trên
            platforms.forEach(p => {
                if (p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * (canvas.width - platformWidth);
                    p.type = getRandomPlatformType();
                    p.broken = false;
                }
            });

            if (player.y > canvas.height) {
                isGameOver = true;
            }
        }

        // Vẽ khuôn mặt "Man Face" biểu cảm
        function drawManFace(x, y, w, h) {
            let cx = x + w / 2;
            let cy = y + h / 2;

            ctx.fillStyle = "#FFD700";
            ctx.strokeStyle = "#B8860B";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, w / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx - 12, cy - 8);
            ctx.lineTo(cx - 3, cy - 14);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + 3, cy - 14);
            ctx.lineTo(cx + 12, cy - 8);
            ctx.stroke();

            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(cx - 7, cy - 3, 2.5, 0, Math.PI * 2);
            ctx.arc(cx + 7, cy - 3, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.arc(cx + 1, cy + 8, 10, 0.2, Math.PI - 0.2, false);
            ctx.stroke();
        }

        // Vẽ đồ họa lên màn hình
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            platforms.forEach(p => {
                if (p.broken) return;

                if (p.type === 'normal') {
                    ctx.fillStyle = "#4CAF50";
                } else if (p.type === 'break') {
                    ctx.fillStyle = "#8D6E63";
                } else if (p.type === 'trap') {
                    ctx.fillStyle = "#F44336";
                }

                ctx.fillRect(p.x, p.y, platformWidth, platformHeight);
                
                if (p.type === 'break' || p.type === 'trap') {
                    ctx.strokeStyle = "#333";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(p.x, p.y, platformWidth, platformHeight);
                }
            });

            drawManFace(player.x, player.y, player.width, player.height);

            ctx.fillStyle = "#000";
            ctx.font = "18px Arial";
            ctx.fillText("Điểm: " + score, 15, 25);

            if (score >= 200) {
                ctx.fillStyle = "#d32f2f";
                ctx.font = "13px Arial";
                ctx.fillText("⚠️ CẨN THẬN: Nâu = Gãy | Đỏ = Bẫy!", 15, 48);
            }

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#FFF";
                ctx.font = "30px Arial";
                ctx.fillText("GAME OVER", 105, 220);
                
                ctx.font = "16px Arial";
                ctx.fillText("Điểm đạt được: " + score, 130, 255);

                ctx.font = "15px Arial";
                ctx.fillText("Nhấn PHÍM CÁCH (Space) để chơi lại", 75, 295);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener("keydown", e => {
            if (e.code === "Space" && isGameOver) {
                resetGame();
            }
        });

        initPlatforms();
        loop();
    </script>
</body>
</html>
