<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump trên GitHub</title>
    <style>
        body {
            background-color: #202020;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #f7f7f7;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        p {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>DOODLE JUMP</h1>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <p>Dùng phím mũi tên <b>Trái / Phải</b> hoặc phím <b>A / D</b> để di chuyển.</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let isGameOver = false;

        // Nhân vật (Doodler) - Đặt vị trí ban đầu đứng vững trên thanh đầu tiên
        let player = {
            x: 180,
            y: 360,
            width: 40,
            height: 40,
            vx: 0,
            vy: 0
        };

        // Danh sách các thanh nhảy (Platforms)
        let platforms = [];
        const platformWidth = 80;
        const platformHeight = 15;
        let platformCount = 6;

        // Phím bấm
        let keys = {};
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        // Khởi tạo các thanh nhảy ban đầu (Thanh đầu tiên nằm ngay dưới chân nhân vật)
        function initPlatforms() {
            platforms = [];
            // Thanh đầu tiên đỡ nhân vật ngay khi vào game
            platforms.push({
                x: 160,
                y: 400
            });

            // Các thanh phía trên
            for (let i = 1; i < platformCount; i++) {
                let pY = 400 - (i * 75);
                platforms.push({
                    x: Math.random() * (canvas.width - platformWidth),
                    y: pY
                });
            }
        }

        // Bắt đầu lại game
        function resetGame() {
            score = 0;
            isGameOver = false;
            player.x = 180;
            player.y = 360;
            player.vx = 0;
            player.vy = 0;
            initPlatforms();
        }

        // Cập nhật logic game (Tốc độ chậm và mượt hơn)
        function update() {
            if (isGameOver) return;

            // Di chuyển trái/phải mượt mà hơn
            if (keys["ArrowLeft"] || keys["KeyA"]) {
                player.vx = -4;
            } else if (keys["ArrowRight"] || keys["KeyD"]) {
                player.vx = 4;
            } else {
                player.vx *= 0.8; 
            }

            player.x += player.vx;

            // Xuyên màn hình trái/phải
            if (player.x > canvas.width) player.x = -player.width;
            if (player.x < -player.width) player.x = canvas.width;

            // Trọng lực kéo nhân vật xuống (giảm nhẹ để game chậm lại)
            player.vy += 0.25;
            player.y += player.vy;

            // Xử lý khi nhân vật chạm đỉnh màn hình -> Cuộn cảnh xuống
            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                platforms.forEach(p => {
                    p.y += diff;
                });
                score += Math.floor(diff * 0.5); // Tăng điểm chậm hơn tương ứng tốc độ game
            }

            // Va chạm với các thanh nhảy (chỉ khi đang rơi xuống)
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (
                        player.x + player.width > p.x &&
                        player.x < p.x + platformWidth &&
                        player.y + player.height >= p.y &&
                        player.y + player.height <= p.y + platformHeight + player.vy
                    ) {
                        player.vy = -8.5; // Lực nảy nhẹ nhàng hơn
                    }
                });
            }

            // Tạo thanh nhảy mới phía trên khi thanh cũ trôi xuống dưới
            platforms.forEach(p => {
                if (p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * (canvas.width - platformWidth);
                }
            });

            // Kiểm tra thua (rơi xuống đáy)
            if (player.y > canvas.height) {
                isGameOver = true;
            }
        }

        // Vẽ đồ họa lên màn hình
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ các thanh nhảy (màu xanh lá)
            ctx.fillStyle = "#4CAF50";
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, platformWidth, platformHeight);
            });

            // Vẽ nhân vật (màu cam)
            ctx.fillStyle = "#FF5722";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Hiển thị điểm số
            ctx.fillStyle = "#000";
            ctx.font = "18px Arial";
            ctx.fillText("Điểm: " + score, 15, 25);

            // Nếu thua, hiển thị màn hình Game Over
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#FFF";
                ctx.font = "30px Arial";
                ctx.fillText("GAME OVER", 100, 220);
                
                ctx.font = "16px Arial";
                ctx.fillText("Nhấn PHÍM CÁCH (Space) để chơi lại", 75, 270);
            }
        }

        // Vòng lặp game (Game Loop)
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Phím chơi lại
        window.addEventListener("keydown", e => {
            if (e.code === "Space" && isGameOver) {
                resetGame();
            }
        });

        // Khởi động game
        initPlatforms();
        loop();
    </script>
</body>
</html>
