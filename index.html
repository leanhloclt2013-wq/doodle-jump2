<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump - Minecraft Chill Edition</title>
    <style>
        body {
            background-color: #121824;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 4px solid #fff;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            image-rendering: pixelated; /* Giữ độ nét Pixel Art */
        }
        p {
            font-size: 14px;
            color: #ddd;
        }
        .music-hint {
            color: #a29bfe;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>DOODLE JUMP: MINECRAFT EDITION</h1>
    <canvas id="gameCanvas" width="480" height="550"></canvas>
    <p>Dùng phím mũi tên <b>Trái / Phải</b> hoặc phím <b>A / D</b> để di chuyển.<br>
    <span class="music-hint">🎵 Nhấn phím bất kỳ để bật nhạc chill & bắt đầu!</span><br>
    <span style="color: #ff7675;">⚠️ Cảnh báo (>200 điểm): Tránh thanh Gai (Bẫy) & Cẩn thận thanh Nứt (Gãy)!</span></p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let isGameOver = false;

        // Nhân vật
        let player = {
            x: 218,
            y: 420,
            width: 44,
            height: 44,
            vx: 0,
            vy: 0
        };

        // Danh sách các thanh nhảy, hiệu ứng & tuyết rơi
        let platforms = [];
        let particles = [];
        let snowflakes = [];
        const platformWidth = 85;
        const platformHeight = 18;
        let platformCount = 8;

        // Khởi tạo tuyết rơi
        for (let i = 0; i < 40; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 1,
                speed: Math.random() * 0.8 + 0.3,
                wind: Math.random() * 0.4 - 0.2
            });
        }

        // Bắn ra các hạt mảnh vụn Pixel khi va chạm
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x + Math.random() * platformWidth,
                    y: y + Math.random() * platformHeight,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.7) * 4,
                    size: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1
                });
            }
        }

        // --- HỆ THỐNG ÂM THANH CHILL (Web Audio API) ---
        let audioCtx = null;
        let isMusicPlaying = false;
        let noteIndex = 0;
        const chillNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 440.00, 392.00];

        function startChillMusic() {
            if (isMusicPlaying) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isMusicPlaying = true;

            setInterval(() => {
                if (!isGameOver && audioCtx) {
                    try {
                        let osc = audioCtx.createOscillator();
                        let gainNode = audioCtx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(chillNotes[noteIndex], audioCtx.currentTime);
                        
                        gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                        osc.connect(gainNode);
                        gainNode.connect(audioCtx.destination);

                        osc.start();
                        osc.stop(audioCtx.currentTime + 1.2);

                        noteIndex = (noteIndex + 1) % chillNotes.length;
                    } catch (e) {}
                }
            }, 600);
        }

        // Lắng nghe phím
        let keys = {};
        window.addEventListener("keydown", e => {
            keys[e.code] = true;
            startChillMusic();
            if (e.code === "Space" && isGameOver) {
                resetGame();
            }
        });
        window.addEventListener("keyup", e => keys[e.code] = false);

        // Sinh loại thanh nhảy ngẫu nhiên
        function getRandomPlatformType(lastType) {
            if (score < 200) {
                // < 200 điểm: thanh thường + 15% lò xo
                if (Math.random() < 0.15) return 'spring';
                return 'normal';
            }
            if (lastType === 'break' || lastType === 'trap') return 'normal';

            let rand = Math.random();
            if (score >= 200 && score < 500) {
                if (rand < 0.15) return 'break';
                else if (rand < 0.30) return 'spring';
            } else if (score >= 500) {
                if (rand < 0.20) return 'break';
                else if (rand < 0.35) return 'trap';
                else if (rand < 0.50) return 'spring';
            }
            return 'normal';
        }

        // Khởi tạo danh sách thanh
        function initPlatforms() {
            platforms = [];
            platforms.push({
                x: 197,
                y: 470,
                type: 'normal',
                broken: false
            });

            let prevType = 'normal';
            for (let i = 1; i < platformCount; i++) {
                let pY = 470 - (i * 65);
                let type = getRandomPlatformType(prevType);
                let prevX = platforms[i - 1].x;
                let minX = Math.max(0, prevX - 150);
                let maxX = Math.min(canvas.width - platformWidth, prevX + 150);
                let pX = minX + Math.random() * (maxX - minX);

                platforms.push({
                    x: pX,
                    y: pY,
                    type: type,
                    broken: false
                });
                prevType = type;
            }
        }

        function resetGame() {
            score = 0;
            isGameOver = false;
            player.x = 218;
            player.y = 420;
            player.vx = 0;
            player.vy = 0;
            particles = [];
            initPlatforms();
        }

        // Cập nhật game
        function update() {
            if (isGameOver) return;

            if (keys["ArrowLeft"] || keys["KeyA"]) {
                player.vx = -4.8;
            } else if (keys["ArrowRight"] || keys["KeyD"]) {
                player.vx = 4.8;
            } else {
                player.vx *= 0.8; 
            }

            player.x += player.vx;
            if (player.x > canvas.width) player.x = -player.width;
            if (player.x < -player.width) player.x = canvas.width;

            player.vy += 0.22; 
            player.y += player.vy;

            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                platforms.forEach(p => p.y += diff);
                score += Math.floor(diff * 0.3); 
            }

            // Xử lý va chạm
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (
                        !p.broken &&
                        player.x + player.width > p.x &&
                        player.x < p.x + platformWidth &&
                        player.y + player.height >= p.y &&
                        player.y + player.height <= p.y + platformHeight + player.vy
                    ) {
                        if (p.type === 'trap') {
                            isGameOver = true; // Chạm gai -> Thua ngay
                        } else if (p.type === 'break') {
                            p.broken = true;
                            createParticles(p.x, p.y, "#8B5A2B");
                        } else if (p.type === 'spring') {
                            player.vy = -13.0; // Bật lò xo siêu cao!
                            createParticles(p.x, p.y, "#FFD700");
                        } else {
                            player.vy = -8.0; // Nhảy thường
                            createParticles(p.x, p.y, "#55FF55");
                        }
                    }
                });
            }

            // Tái tạo thanh phía trên
            platforms.forEach(p => {
                if (p.y > canvas.height) {
                    let minY = Math.min(...platforms.map(item => item.y));
                    let highestPlatform = platforms.find(item => item.y === minY);
                    let lastType = highestPlatform ? highestPlatform.type : 'normal';
                    let lastX = highestPlatform ? highestPlatform.x : canvas.width / 2;

                    let minX = Math.max(0, lastX - 160);
                    let maxX = Math.min(canvas.width - platformWidth, lastX + 160);
                    let pX = minX + Math.random() * (maxX - minX);

                    p.y = minY - 65; 
                    p.x = pX;
                    p.type = getRandomPlatformType(lastType);
                    p.broken = false;
                }
            });

            // Cập nhật tuyết
            snowflakes.forEach(sf => {
                sf.y += sf.speed;
                sf.x += sf.wind;
                if (sf.y > canvas.height) {
                    sf.y = 0;
                    sf.x = Math.random() * canvas.width;
                }
            });

            // Cập nhật hạt hiệu ứng
            particles.forEach((pt, index) => {
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.03;
                if (pt.alpha <= 0) particles.splice(index, 1);
            });

            if (player.y > canvas.height) {
                isGameOver = true;
            }
        }

        // Vẽ Khối Cỏ Minecraft Pixel (Grass Block)
        function drawMinecraftGrassBlock(x, y, w, h, isBroken) {
            // Nền đất nâu
            ctx.fillStyle = "#8B5A2B";
            ctx.fillRect(x, y, w, h);

            // Chi tiết Pixel đất nâu đậm
            ctx.fillStyle = "#5C3A1E";
            for (let px = 0; px < w; px += 10) {
                if ((px / 10) % 2 === 0) {
                    ctx.fillRect(x + px, y + 8, 5, 5);
                }
            }

            // Mặt cỏ xanh lá bên trên
            ctx.fillStyle = "#55FF55";
            ctx.fillRect(x, y, w, 5);

            // Rễ cỏ rủ xuống băm ruy-băng
            ctx.fillStyle = "#388E3C";
            for (let px = 0; px < w; px += 8) {
                let rh = (px % 16 === 0) ? 8 : 4;
                ctx.fillRect(x + px, y + 5, 4, rh);
            }

            // Nếu gãy: Vẽ vết nứt ngoằn ngoèo ở giữa
            if (isBroken) {
                ctx.fillStyle = "#2D1E10";
                ctx.beginPath();
                ctx.moveTo(x + w / 2 - 4, y);
                ctx.lineTo(x + w / 2 + 2, y + 7);
                ctx.lineTo(x + w / 2 - 3, y + 12);
                ctx.lineTo(x + w / 2 + 4, y + h);
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#2D1E10";
                ctx.stroke();
            }
        }

        // Vẽ Gai Nhọn (Bẫy)
        function drawSpikes(x, y, w) {
            ctx.fillStyle = "#E0E0E0";
            ctx.strokeStyle = "#757575";
            ctx.lineWidth = 1;

            let spikeCount = 6;
            let spikeWidth = w / spikeCount;

            for (let i = 0; i < spikeCount; i++) {
                let sx = x + i * spikeWidth;
                ctx.beginPath();
                ctx.moveTo(sx, y);
                ctx.lineTo(sx + spikeWidth / 2, y - 10);
                ctx.lineTo(sx + spikeWidth, y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }

        // Vẽ Lò Xo (Spring)
        function drawSpring(x, y, w) {
            let sx = x + w / 2 - 10;
            let sy = y - 12;

            ctx.strokeStyle = "#C0C0C0";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(sx + 10, sy + 3, 8, 0, Math.PI * 2);
            ctx.stroke();

            // Đế lò xo màu đỏ
            ctx.fillStyle = "#E74C3C";
            ctx.fillRect(sx, y - 3, 20, 3);
        }

        // Vẽ Man Face
        function drawManFace(x, y, w, h) {
            let cx = x + w / 2;
            let cy = y + h / 2;

            ctx.fillStyle = "#FFEAA7";
            ctx.strokeStyle = "#D63031";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(cx, cy, w / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = "#2D3436";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx - 12, cy - 8);
            ctx.lineTo(cx - 3, cy - 14);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + 3, cy - 14);
            ctx.lineTo(cx + 12, cy - 8);
            ctx.stroke();

            ctx.fillStyle = "#2D3436";
            ctx.beginPath();
            ctx.arc(cx - 7, cy - 3, 2.5, 0, Math.PI * 2);
            ctx.arc(cx + 7, cy - 3, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.arc(cx + 1, cy + 8, 10, 0.2, Math.PI - 0.2, false);
            ctx.stroke();
        }

        // Loop vẽ đồ họa
        function draw() {
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, "#0984E3");
            grad.addColorStop(0.5, "#6C5CE7");
            grad.addColorStop(1, "#DFE6E9");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tuyết rơi
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            snowflakes.forEach(sf => {
                ctx.beginPath();
                ctx.arc(sf.x, sf.y, sf.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vẽ các loại thanh nhảy Minecraft
            platforms.forEach(p => {
                if (p.broken) return;

                if (p.type === 'normal') {
                    drawMinecraftGrassBlock(p.x, p.y, platformWidth, platformHeight, false);
                } else if (p.type === 'break') {
                    drawMinecraftGrassBlock(p.x, p.y, platformWidth, platformHeight, true);
                } else if (p.type === 'trap') {
                    drawMinecraftGrassBlock(p.x, p.y, platformWidth, platformHeight, false);
                    drawSpikes(p.x, p.y, platformWidth);
                } else if (p.type === 'spring') {
                    drawMinecraftGrassBlock(p.x, p.y, platformWidth, platformHeight, false);
                    drawSpring(p.x, p.y, platformWidth);
                }
            });

            // Vẽ các hạt Pixel
            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.alpha;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
                ctx.globalAlpha = 1.0;
            });

            // Vẽ nhân vật
            drawManFace(player.x, player.y, player.width, player.height);

            // Điểm số
            ctx.fillStyle = "#FFF";
            ctx.font = "bold 20px Arial";
            ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
            ctx.shadowBlur = 4;
            ctx.fillText("Điểm: " + score, 20, 30);
            ctx.shadowBlur = 0;

            if (score >= 200) {
                ctx.fillStyle = "#FF7675";
                ctx.font = "bold 13px Arial";
                ctx.fillText("⚠️ Nứt = Gãy | Gai = Bẫy | Lò Xo = Nhảy Cao!", 20, 55);
            }

            // Game Over
            if (isGameOver) {
                ctx.fillStyle = "rgba(18, 24, 36, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#FFF";
                ctx.font = "bold 32px Arial";
                ctx.fillText("GAME OVER", 130, 210);
                
                ctx.font = "18px Arial";
                ctx.fillText("Điểm đạt được: " + score, 165, 250);

                ctx.fillStyle = "#55FF55";
                ctx.font = "bold 16px Arial";
                ctx.fillText("Nhấn PHÍM CÁCH (Space) để chơi lại", 100, 295);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initPlatforms();
        loop();
    </script>
</body>
</html>
